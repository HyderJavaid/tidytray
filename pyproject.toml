[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidytray"
dynamic = ["version"]
description = "Safely organize a cluttered Downloads folder."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "HyderJavaid" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Desktop Environment :: File Managers",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
tidytray = "tidytray.app:main"

[project.urls]
Homepage = "https://github.com/naOomeow/tidytray"

[tool.setuptools]
packages = ["tidytray", "tidytray.ui"]

[tool.setuptools.dynamic]
version = { attr = "tidytray.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
